<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ebb</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <style>
      html, body { margin: 0; height: 100%; background: #07090c; overflow: hidden; }
      #world { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
      #ui { position: fixed; inset: 0; pointer-events: none; font-family: Georgia, 'Times New Roman', serif; color: #f1ead9; }
      #title { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 2.5s ease; text-shadow: 0 1px 18px rgba(0, 0, 0, 0.55); }
      #title h1 { font-weight: 400; font-size: clamp(48px, 9vw, 120px); letter-spacing: 0.32em; margin: 0 0 0 0.32em; }
      #title p { font-size: clamp(14px, 1.5vw, 19px); letter-spacing: 0.14em; margin: 2.2em 0 0; opacity: 0.85; }
      #title.gone { opacity: 0; }
      #hint { position: absolute; left: 0; right: 0; bottom: 9%; text-align: center; font-size: clamp(14px, 1.4vw, 18px); letter-spacing: 0.1em; opacity: 0; transition: opacity 0.6s ease; text-shadow: 0 1px 12px rgba(0, 0, 0, 0.7); }
      #hint.on { opacity: 0.92; }
      #note { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); max-width: min(560px, 80vw); padding: 28px 34px; background: rgba(16, 14, 11, 0.78); border: 1px solid rgba(241, 234, 217, 0.22); font-size: clamp(15px, 1.5vw, 19px); line-height: 1.6; opacity: 0; transition: opacity 0.5s ease; white-space: pre-wrap; }
      #note.on { opacity: 1; }
      #note small { display: block; margin-top: 1.1em; opacity: 0.7; letter-spacing: 0.06em; }
      #loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: #07090c; letter-spacing: 0.3em; font-size: 15px; transition: opacity 1.2s ease; }
      #loading.gone { opacity: 0; }
    </style>
  </head>
  <body>
    <canvas id="world"></canvas>
    <div id="ui">
      <div id="title"><h1>EBB</h1><p>click to walk</p></div>
      <div id="hint"></div>
      <div id="note"></div>
      <div id="loading">the tide is turning</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
